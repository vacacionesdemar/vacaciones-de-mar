
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vacaciones de Mar - Inmobiliaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"/>
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #f0f4f8;
    }
    header {
      background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') no-repeat center center/cover;
      height: 100vh;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    header h1 {
      font-size: 3rem;
      background: rgba(0,0,0,0.5);
      padding: 1rem 2rem;
      border-radius: 10px;
    }
    section {
      padding: 3rem 1rem;
      max-width: 1000px;
      margin: auto;
    }
    h2 {
      color: #005b96;
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .mapa {
      width: 100%;
      height: 400px;
      border-radius: 10px;
      overflow: hidden;
    }
    .whatsapp {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
    }
    .whatsapp img {
      width: 60px;
      height: 60px;
    }
    footer {
      text-align: center;
      background: #005b96;
      color: white;
      padding: 1rem;
    }
  </style>
</head>
<body>

<header>
  <h1>Vacaciones de Mar - Inmobiliaria</h1>
</header>

<section>
  <h2>Ubicación: Roquetas de Mar y Alrededores</h2>
  <p>Encuentra propiedades únicas para vacaciones o inversión en las zonas más hermosas de Almería.</p>
  <div class="mapa" id="map"></div>
</section>

<div class="whatsapp">
  <a href="https://wa.me/34662419543" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" />
  </a>
</div>

<footer>
  Contacto: vacacionesdemar@gmail.com | Tel: 662 419 543 / 671 316 074
</footer>

<script>
  function initMap() {
    const roquetas = { lat: 36.7641, lng: -2.6157 };
    const map = new google.maps.Map(document.getElementById("map"), {
      zoom: 12,
      center: roquetas
    });
    new google.maps.Marker({ position: roquetas, map });
  }
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDgr5fG90lZ9UptP3UnBTKom7eOU-Nis_4&callback=initMap"></script>
</body>
</html>
