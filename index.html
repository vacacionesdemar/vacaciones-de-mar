<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacaciones de Mar - Inmobiliaria</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
    }
    #mapa {
      height: 400px;
      width: 100%;
      margin-top: 2rem;
      border-radius: 10px;
      overflow: hidden;
    }
    .section-title {
      font-size: 2rem;
      margin: 1rem 0;
      text-align: center;
    }
    section {
      padding: 2rem;
      background-color: #f9f9f9;
    }
    p {
      text-align: center;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <section id="ubicacion">
    <h2 class="section-title">Ubicación: Roquetas de Mar y Alrededores</h2>
    <p>Nuestras propiedades se encuentran en las mejores zonas costeras de Roquetas de Mar, Almería y alrededores.</p>
    <div id="mapa"></div>
  </section>

  <script>
    function initMap() {
      const roquetas = { lat: 36.7641, lng: -2.6157 };
      const map = new google.maps.Map(document.getElementById("mapa"), {
        zoom: 11,
        center: roquetas
      });
      new google.maps.Marker({
        position: roquetas,
        map,
        title: "Vacaciones de Mar - Roquetas de Mar"
      });
    }
  </script>
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDgr5fG90lZ9UptP3UnBTKom7eOU-Nis_4&callback=initMap"></script>
</body>
</html>
